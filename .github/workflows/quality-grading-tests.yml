name: Quality grading tests

on:
  pull_request:
    paths:
      - "quality_grading_system/**"
      - "appleproj_interfaces/**"
      - "docs/features/quality_grading.md"
      - "docs/architecture/ros2_interfaces.md"
      - "docs/architecture/tf_frames.md"
      - ".github/workflows/quality-grading-tests.yml"
  push:
    paths:
      - "quality_grading_system/**"
      - "appleproj_interfaces/**"
      - ".github/workflows/quality-grading-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Run quality grading tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: quality_grading_system
        run: python -m unittest discover -s quality_grading_system/test -v

  ros-jazzy-build:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-numpy \
            python3-pil
      - name: Build ROS packages and verify generated messages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select appleproj_interfaces quality_grading_system
          source install/setup.bash
          python3 -c "from appleproj_interfaces.msg import InspectionCompleted, InspectionImage; message = InspectionImage(); assert hasattr(message, 'ignore_mask')"
      - name: Run quality grading tests in ROS environment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: quality_grading_system
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m unittest discover -s quality_grading_system/test -v

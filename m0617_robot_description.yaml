# M0617 Lula robot description
#
# 이 파일은 Lula IK가 M0617의 6개 팔 관절만 계산하도록 정의한다.
# IK end-effector는 URDF의 link_6-gripper_frame 고정 관절이 정의한
# 실제 파지 중심이며, 3F 그리퍼의 11개 관절은 apple_pick.py에서
# 별도로 제어한다.

api_version: 1.0

cspace:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

root_link: base_link

# IK가 여러 해를 찾을 때 사용하는 기준 자세이다.
default_q: [0.0, 0.0, -1.5708, 0.0, 1.5708, 0.0]

acceleration_limits: [4.0, 4.0, 5.0, 8.0, 8.0, 8.0]
jerk_limits: [2000.0, 2000.0, 2500.0, 4000.0, 4000.0, 4000.0]

# Lula IK와 RMPflow가 함께 사용하는 로봇 충돌 근사 형상이다. base_link부터
# link_6까지는 URDF collision DAE의 삼각형 표면을 PCA 장축을 따라 약 50 mm
# 간격으로 분할하고, 각 구가 담당하는 표면까지의 최대 거리에 10 mm를 더했다.
# collision mesh가 없는 가상 gripper_frame은 기존 palm/TCP 구 2개만 유지한다.
# 세 손가락 형상 sphere를 여기에 추가하면 Lula의 나무 obstacle이 커져 기존의
# 안전한 경로까지 막을 수 있다. 목표 사과에 대한 staging 검사는 apple_pick.py가
# 실행 중인 실제 gripper collision mesh의 TCP 반경을 측정해 수학적으로 수행하며,
# Stage 또는 planner에 추가 collider/proxy를 만들지 않는다.
collision_spheres:
    # base_link: PCA axis [0.119698, 0.992370, 0.029575]
    - base_link:
        - "center": [-0.042479, -0.348837, 0.011927]
          "radius": 0.101210
        - "center": [-0.037083, -0.304102, 0.013260]
          "radius": 0.081827

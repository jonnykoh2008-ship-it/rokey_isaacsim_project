# M0617 Lula robot description
#
# 이 파일은 Lula IK가 M0617의 6개 팔 관절만 계산하도록 정의한다.
# IK end-effector는 URDF의 link_6-gripper_frame 고정 관절이 정의한
# 실제 파지 중심이며, 3F 그리퍼의 11개 관절은 apple_pick.py에서
# 별도로 제어한다.

api_version: 1.0

cspace:
    - joint_1
    - joint_2
    - joint_3
    - joint_4
    - joint_5
    - joint_6

root_link: base_link

# IK가 여러 해를 찾을 때 사용하는 기준 자세이다.
default_q: [0.0, -1.5708, 1.5708, 0.0, 1.5708, 0.0]

acceleration_limits: [4.0, 4.0, 5.0, 8.0, 8.0, 8.0]
jerk_limits: [2000.0, 2000.0, 2500.0, 4000.0, 4000.0, 4000.0]

# Lula IK와 RMPflow가 함께 사용하는 로봇 충돌 근사 형상이다. 그리퍼 sphere는
# 조립 USD의 Palm -> TCP 125mm 구간과 최대 155mm 개구폭을 보수적으로 감싼다.
# link_2는 joint_3까지의 +X 0.845m 구간, link_3는 joint_4까지의 -Y 0.734m
# 구간을 덮는다. link_4~link_6은 URDF collision mesh의 로컬 범위를
# 보수적으로 근사한다. sphere 위치와 반경은 시뮬레이션 시각화 후 재검증한다.
collision_spheres:
    - base_link:
        - "center": [0.0, 0.0, 0.08]
          "radius": 0.11

    - link_1:
        - "center": [0.0, 0.0, 0.03]
          "radius": 0.10

    - link_2:
        - "center": [0.10, 0.00, 0.04]
          "radius": 0.09
        - "center": [0.28, 0.00, 0.08]
          "radius": 0.085
        - "center": [0.46, 0.00, 0.11]
          "radius": 0.08
        - "center": [0.64, 0.00, 0.14]
          "radius": 0.075
        - "center": [0.80, 0.00, 0.16]
          "radius": 0.07

    - link_3:
        - "center": [0.0, -0.08, 0.0]
          "radius": 0.10
        - "center": [0.0, -0.22, 0.0]
          "radius": 0.095
        - "center": [0.0, -0.38, 0.0]
          "radius": 0.09
        - "center": [0.0, -0.54, 0.0]
          "radius": 0.085
        - "center": [0.0, -0.68, 0.0]
          "radius": 0.08

    - link_4:
        - "center": [0.0, 0.01, -0.22]
          "radius": 0.10
        - "center": [0.0, 0.01, -0.08]
          "radius": 0.10
        - "center": [0.0, 0.01, 0.08]
          "radius": 0.10
        - "center": [0.0, 0.01, 0.22]
          "radius": 0.10

    - link_5:
        - "center": [0.0, 0.02, 0.02]
          "radius": 0.10
        - "center": [0.0, -0.08, 0.0]
          "radius": 0.08

    - link_6:
        - "center": [0.0, 0.00, -0.03]
          "radius": 0.06

    - gripper_frame:
        - "center": [0.0, 0.00, 0.0]
          "radius": 0.08
        - "center": [0.0, -0.07, 0.0]
          "radius": 0.09

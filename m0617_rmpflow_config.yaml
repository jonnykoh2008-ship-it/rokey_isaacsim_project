# M0617 RMPflow initial tuning for Isaac Sim 5.1.0.
#
# NVIDIA Isaac Sim 5.1 UR10e 기본 정책을 시작점으로 사용한 임시값이다.
# 실제 M0617, 3F 그리퍼 및 나무 planning proxy 시험 후 조정한다. collision_rmp
# 값은 수백 개 proxy의 중첩 반발로 정지하는 현상을 줄이기 위한 임시값이다.

api_version: 1.0

joint_limit_buffers: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]

rmp_params:
    cspace_target_rmp:
        metric_scalar: 50.0
        position_gain: 100.0
        damping_gain: 50.0
        robust_position_term_thresh: 0.5
        inertia: 1.0
    cspace_trajectory_rmp:
        p_gain: 80.0
        d_gain: 10.0
        ff_gain: 0.25
        weight: 50.0
    cspace_affine_rmp:
        final_handover_time_std_dev: 0.25
        weight: 2000.0
    joint_limit_rmp:
        metric_scalar: 1000.0
        metric_length_scale: 0.01
        metric_exploder_eps: 0.001
        metric_velocity_gate_length_scale: 0.01
        accel_damper_gain: 200.0
        accel_potential_gain: 1.0
        accel_potential_exploder_length_scale: 0.1
        accel_potential_exploder_eps: 0.01
    joint_velocity_cap_rmp:
        max_velocity: 1.5
        velocity_damping_region: 0.4
        damping_gain: 300.0
        metric_weight: 100.0
    target_rmp:
        accel_p_gain: 80.0
        accel_d_gain: 120.0
        accel_norm_eps: 0.075
        metric_alpha_length_scale: 0.05
        min_metric_alpha: 0.01
        max_metric_scalar: 10000.0
        min_metric_scalar: 2500.0
        proximity_metric_boost_scalar: 20.0
        proximity_metric_boost_length_scale: 0.02
        accept_user_weights: false
    axis_target_rmp:
        accel_p_gain: 200.0
        accel_d_gain: 40.0
        metric_scalar: 10.0
        proximity_metric_boost_scalar: 3000.0
        proximity_metric_boost_length_scale: 0.05
        accept_user_weights: false
    collision_rmp:
        damping_gain: 50.0
        damping_std_dev: 0.04
        damping_robustness_eps: 0.01
        damping_velocity_gate_length_scale: 0.01
        repulsion_gain: 400.0
        repulsion_std_dev: 0.01
        metric_modulation_radius: 0.15
        metric_scalar: 2000.0
        metric_exploder_std_dev: 0.02
        metric_exploder_eps: 0.001
    damping_rmp:
        accel_d_gain: 30.0
        metric_scalar: 50.0
        inertia: 100.0

canonical_resolve:
    max_acceleration_norm: 40.0
    projection_tolerance: 0.01
    verbose: false

body_cylinders:
    - name: base_link
      pt1: [0.0, 0.0, 0.20]
      pt2: [0.0, 0.0, 0.0]
      radius: 0.11

body_collision_controllers:
    - name: link_5
      radius: 0.07
    - name: link_6
      radius: 0.07
    - name: gripper_frame
      radius: 0.09
